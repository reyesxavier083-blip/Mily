name: LEYRA tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q mily_core leyra_core tests
      - name: Run engine tests
        run: python -m unittest discover -s tests -v

  leyra-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r backend/leyra-api/requirements.txt
      - name: Compile API sources
        run: python -m compileall -q backend/leyra-api
      - name: Run API tests
        env:
          PYTHONPATH: .:backend/leyra-api
        run: python -m unittest discover -s backend/leyra-api/tests -v

  web-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate web client syntax
        run: node --check web/app.js
      - name: Assert interface assets are present
        run: |
          test -s web/index.html
          test -s web/styles.css
          test -s web/app.js
          grep -q "LEYRA IA" web/index.html

  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/mily-openai
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check backend syntax
        run: npm run check
      - name: Test production authentication guard
        run: npm test
