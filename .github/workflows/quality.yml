name: MILY quality checks

on:
  push:
    branches: [main, "mily/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q mily_core tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check backend JavaScript when present
        shell: bash
        run: |
          if compgen -G "backend/mily-openai/*.mjs" > /dev/null; then
            node --version
            for file in backend/mily-openai/*.mjs; do node --check "$file"; done
          else
            echo "Backend archive is not expanded in this repository; JavaScript check skipped."
          fi
